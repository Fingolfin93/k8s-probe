apiVersion: v1
kind: Pod
metadata:
  name: pgprobe2
  namespace: default
  labels:
    app: pgprobe2
spec:
  restartPolicy: Never
  containers:
    - name: p
      image: postgres:16-alpine
      command:
        - sh
        - -c
        - |
          PW='V@leNtinoRo$$i'
          echo "PW=[$PW] len=${#PW}"
          for h in 10.0.2.165 10.0.2.212 10.0.2.161 10.0.2.155; do
            for db in master postgres; do
              echo -n "$h/$db -> "
              PGPASSWORD="$PW" psql -h $h -U dbuser -d $db -tAc "select current_user, usesuper" 2>&1 | head -1
            done
          done
          sleep 600
