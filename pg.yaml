apiVersion: v1
kind: Pod
metadata:
  name: pgprobe5
  namespace: default
  labels:
    app: pgprobe5
spec:
  restartPolicy: Never
  containers:
    - name: p
      image: postgres:16-alpine
      command:
        - sh
        - -c
        - |
          PW=$(echo VkBsZU50aW5vUm8kJGk= | base64 -d)
          echo -n "cmp 库总数: "
          PGPASSWORD="$PW" psql -h 10.0.2.212 -U dbuser -d postgres -tAc "select count(*) from pg_database where datname not in ('template0','template1')"
          echo -n "rdb 库总数: "
          PGPASSWORD="$PW" psql -h 10.0.2.161 -U dbuser -d postgres -tAc "select count(*) from pg_database where datname not in ('template0','template1')"
          echo "=== master 表 ==="
          PGPASSWORD="$PW" psql -h 10.0.2.165 -U dbuser -d master -tAc "select table_name from information_schema.tables where table_schema='public' order by 1" 2>&1 | head -15
          echo "=== aamc_iau 表数 ==="
          PGPASSWORD="$PW" psql -h 10.0.2.212 -U dbuser -d aamc_iau -tAc "select count(*) from information_schema.tables where table_schema='public'" 2>&1 | head -2
          echo "=== aamc_iau 表名样本 ==="
          PGPASSWORD="$PW" psql -h 10.0.2.212 -U dbuser -d aamc_iau -tAc "select table_name from information_schema.tables where table_schema='public' order by 1" 2>&1 | head -12
          sleep 600
