apiVersion: v1
kind: Pod
metadata:
  name: pgprobe3
  namespace: default
  labels:
    app: pgprobe3
spec:
  restartPolicy: Never
  containers:
    - name: p
      image: postgres:16-alpine
      command:
        - sh
        - -c
        - |
          PW=$(echo VkBsZU50aW5vUm8kJGk= | base64 -d)
          echo "len=${#PW}"
          for h in 10.0.2.165 10.0.2.212 10.0.2.161 10.0.2.155; do
            echo -n "$h -> "
            PGPASSWORD="$PW" psql -h $h -U dbuser -d postgres -tAc "select current_user, usesuper" 2>&1 | head -1
          done
          sleep 600
