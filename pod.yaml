          echo "##### spider-quecklink-cm"; cat /cfg_spider-quecklink-cm/* 2>/dev/null | head -c 20000; echo
          echo "##### spider-rope-cm"; cat /cfg_spider-rope-cm/* 2>/dev/null | head -c 20000; echo
          echo "##### spider-ruptela-cm"; cat /cfg_spider-ruptela-cm/* 2>/dev/null | head -c 20000; echo
