apiVersion: v1
kind: Pod
metadata:
  name: cfgdump
  namespace: default
  labels:
    app: cfgdump
spec:
  restartPolicy: Never
  containers:
    - name: d
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          sleep 3
          echo "##### chameleon-service-cm"; cat /cfg_chameleon-service-cm/* 2>/dev/null | head -c 20000; echo
          echo "##### cheetah-cm"; cat /cfg_cheetah-cm/* 2>/dev/null | head -c 20000; echo
          echo "##### elephant-cm"; cat /cfg_elephant-cm/* 2>/dev/null | head -c 20000; echo
