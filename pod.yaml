          echo "##### spider-vanguard-cm"; cat /cfg_spider-vanguard-cm/* 2>/dev/null | head -c 20000; echo
          echo "##### spider-venom-cm"; cat /cfg_spider-venom-cm/* 2>/dev/null | head -c 20000; echo
          echo "##### summary-service-cm"; cat /cfg_summary-service-cm/* 2>/dev/null | head -c 20000; echo
          echo "##### wasl-cm"; cat /cfg_wasl-cm/* 2>/dev/null | head -c 20000; echo
          sleep 900
