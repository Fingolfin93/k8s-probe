apiVersion: v1
kind: Pod
metadata:
  name: cfgdump
  namespace: default
  labels:
    app: cfgdump
spec:
  restartPolicy: Never
  containers:
    - name: d
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          sleep 3
          ls -la /cfg
          echo "=====CONTENT====="
          for f in /cfg/* /cfg/.[!.]*; do [ -f "$f" ] || continue; echo "== $f"; cat "$f"; echo; done
          sleep 900
      volumeMounts:
        - name: config-vol
          mountPath: /cfg
  volumes:
    - name: config-vol
      configMap:
        name: elephant-cm
